name: Compile LaTeX Reports

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive-full:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        # Используем latexmk, он сам прогонит нужное количество раз для ссылок и оглавления
        run: |
          latexmk -pdf -shell-escape -outdir=build main.tex

      - name: Upload PDF report
        uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: build/main.pdf