name: Compile LaTeX Reports

on:
  push:
    branches: [ "main" ] # Срабатывает при пуше в main
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Install TeX Live and Pygments
        run: |
          sudo apt-get update
          # Устанавливаем базовый латех + дополнения для minted и кириллицы
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-lang-cyrillic texlive-bibtex-extra biber latexmk python3-pygments

      - name: Compile LaTeX (Lab 01)
        working-directory: ./lab01/report # Путь к твоей папке с отчетом
        run: latexmk -pdf -shell-escape main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab01_Report
          path: ./lab01/report/main.pdf
